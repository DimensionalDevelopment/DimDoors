plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

def includeCompile(entry) {
    project.dependencies {
        api(entry)
        include(entry)
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // TODO 26.1.2: re-enable when Sable publishes a 26.1.2 Fabric artifact.
    // api("dev.ryanhcode.sable:sable-fabric-${project.minecraft_version}:${project.sable_version}")

//    api "dev.architectury:architectury-fabric:${architectury_version}"

    includeCompile "org.jgrapht:jgrapht-core:1.1.0"
    includeCompile "com.github.DimensionalDevelopment:poly2tri.java:0.1.1"
    includeCompile "com.github.Chocohead:Fabric-ASM:v2.3"

    api "maven.modrinth:wthit:fabric-${wthitVersion}"
    api("me.shedaniel.cloth:cloth-config-fabric:${rootProject.properties["cloth_config"]}") {
        exclude(group: "net.fabricmc", module: "fabric-loader")
    }

    api "maven.modrinth:worldedit:${worldedit_version}"

    // implementation "curse.maven:selene-499980:7522322"
    implementation "maven.modrinth:modmenu:${modmenu_version}"

    // TODO 26.1.2: re-enable when REI publishes 26.1.2 artifacts.
    // compileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${rei}"

    compileOnlyApi "mezz.jei:jei-${minecraft_version}-fabric-api:${jei}"

//    switch (recipe_viewer) {
//        case "rei": {
//            runtimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:${rei}"
//            break
//        }
//        case "jei": {
            runtimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei}"
//            break
//        }
//    }

}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        data {
            inherit client
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${project(":common").file("src/main/generated")}"
            vmArg "-Dfabric-api.datagen.modid=${mod_id}"

            runDir "build/datagen"
        }

    }

    sourceSets {
        main {
            java {
                srcDir "src/main/datagen"
            }
            resources {
                srcDirs += [
                        project(":common").file("src/main/generated")
                ]
            }
        }
    }
}
