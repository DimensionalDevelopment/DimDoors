plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

def includeCompile(entry) {
    project.dependencies {
        modApi(entry)
        include(entry)
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    modApi("dev.ryanhcode.sable:sable-fabric-${project.minecraft_version}:${project.sable_version}")

//    modApi "dev.architectury:architectury-fabric:${architectury_version}"

    includeCompile "org.jgrapht:jgrapht-core:1.1.0"
    includeCompile "com.github.DimensionalDevelopment:poly2tri.java:0.1.1"
    includeCompile "com.github.Chocohead:Fabric-ASM:v2.3"

    modApi "mcp.mobius.waila:wthit:fabric-${wthitVersion}"
    // modApi "lol.bai:badpackets:fabric-4.2.0"

    modApi "curse.maven:worldedit-${worldedit_CF}:${worldedit_CF_version}"
    // modApi "com.sk89q.worldedit:worldedit-fabric-mc${world_edit_minecraft_version}:${worldedit}"

    modApi "mcp.mobius.waila:wthit:fabric-${wthitVersion}"
    modImplementation "curse.maven:selene-499980:7522322"
    modImplementation "curse.maven:modmenu-308702:7808443"

    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${rei}"

    modCompileOnlyApi "mezz.jei:jei-${minecraft_version}-fabric-api:${jei}"

//    switch (recipe_viewer) {
//        case "rei": {
//            modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:${rei}"
//            break
//        }
//        case "jei": {
            modRuntimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei}"
//            break
//        }
//    }

    modImplementation "curse.maven:modmenu-308702:5810603"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
        useLegacyMixinAp = true
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        data {
            inherit client
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${project(":common").file("src/main/generated")}"
            vmArg "-Dfabric-api.datagen.modid=dimdoors"

            runDir "build/datagen"
        }

    }

    sourceSets {
        main {
            java {
                srcDir "src/main/datagen"
            }
            resources {
                srcDirs += [
                        project(":common").file("src/main/generated")
                ]
            }
        }
    }
}
