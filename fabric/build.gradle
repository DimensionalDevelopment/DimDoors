plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

def includeCompile(entry) {
    project.dependencies {
        modApi(entry)
        include(entry)
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    modApi("dev.ryanhcode.sable:sable-fabric-${project.minecraft_version}:${project.sable_version}") {
        exclude group: "net.fabricmc", module: "fabric-loader"
    }

    includeCompile "org.apfloat:apfloat:${apfloat_version}"
    includeCompile "org.jheaps:jheaps:${jheaps_version}"
    includeCompile "org.jgrapht:jgrapht-core:${jgrapht_version}"
    includeCompile "com.github.DimensionalDevelopment:poly2tri.java:0.1.1"
    includeCompile "com.github.Chocohead:Fabric-ASM:v2.3"

    modApi "mcp.mobius.waila:wthit:fabric-${wthitVersion}"
    modApi("me.shedaniel.cloth:cloth-config-fabric:${rootProject.properties["cloth_config"]}") {
        exclude(group: "net.fabricmc", module: "fabric-loader")
    }

    modApi "curse.maven:worldedit-${worldedit_CF}:${worldedit_CF_version}"

    modImplementation "curse.maven:selene-499980:7522322"
    modImplementation "curse.maven:modmenu-308702:7808443"
    modCompileOnly("net.caffeinemc:sodium-fabric:${sodium_version}+mc${minecraft_version}") {
        exclude group: "net.fabricmc", module: "fabric-loader"
    }

    modCompileOnly("maven.modrinth:iris:${iris_version}-fabric")

    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${rei}"

    modCompileOnlyApi "mezz.jei:jei-${minecraft_version}-fabric-api:${jei}"

//    switch (recipe_viewer) {
//        case "rei": {
//            modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:${rei}"
//            break
//        }
//        case "jei": {
            modRuntimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei}"
//            break
//        }
//    }

    modImplementation("foundry.imguimc:imguimc-fabric-${project.minecraft_version}:${project.imguimc_version}") {
        exclude group: "net.fabricmc", module: "fabric-loader"
        // imguimc's pom pulls unremapped (intermediary) fabric-api modules onto the
        // run classpath, which loader 0.18+ rejects. fabric-api is declared above.
        exclude group: "net.fabricmc.fabric-api"
    }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
        useLegacyMixinAp = true
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        data {
            inherit client
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${project(":common").file("src/main/generated")}"
            vmArg "-Dfabric-api.datagen.modid=dimdoors"

            runDir "build/datagen"
        }

    }

    sourceSets {
        main {
            java {
                srcDir "src/main/datagen"
            }
            resources {
                srcDirs += [
                        project(":common").file("src/main/generated")
                ]
            }
        }
    }
}

tasks.register("traceFabricLoader") {
    doLast {
        def runtime = configurations.runtimeClasspath

        println "runtimeClasspath hierarchy:"
        runtime.hierarchy.each { configuration ->
            println "\n${project.path}:${configuration.name}"

            configuration.dependencies
                    .findAll {
                        it.group == "net.fabricmc" &&
                                it.name == "fabric-loader"
                    }
                    .each {
                        println "  DIRECT: ${it.group}:${it.name}:${it.version}"
                    }

            configuration.dependencyConstraints
                    .findAll {
                        it.group == "net.fabricmc" &&
                                it.name == "fabric-loader"
                    }
                    .each {
                        println "  CONSTRAINT: ${it.group}:${it.name}:${it.version}"
                    }
        }
    }
}

tasks.register("traceFabricLoaderOrigins") {
    doLast {
        configurations.findAll { configuration ->
            configuration.canBeResolved &&
                    (configuration.name.toLowerCase().contains("mod") ||
                            configuration.name.toLowerCase().contains("runtime"))
        }.each { configuration ->
            try {
                def root = configuration.incoming.resolutionResult.rootComponent.get()
                def paths = []

                def visit
                visit = { component, path, seen ->
                    component.dependencies.each { dependency ->
                        if (!(dependency instanceof org.gradle.api.artifacts.result.ResolvedDependencyResult)) {
                            return
                        }

                        def selected = dependency.selected
                        def module = selected.moduleVersion
                        def edge = "${dependency.requested.displayName} -> ${selected.id.displayName}"
                        def nextPath = path + edge

                        if (module?.group == "net.fabricmc" &&
                                module.name == "fabric-loader") {
                            paths << nextPath
                            return
                        }

                        def nextSeen = new LinkedHashSet(seen)
                        if (nextSeen.add(selected.id)) {
                            visit(selected, nextPath, nextSeen)
                        }
                    }
                }

                visit(root, [], [root.id] as Set)

                if (!paths.empty) {
                    println "\n=== ${configuration.name} ==="

                    paths.each { path ->
                        println path.collect { "  ${it}" }.join("\n")
                        println()
                    }
                }
            } catch (Exception ignored) {
                // Some Loom configurations cannot be resolved independently.
            }
        }
    }
}
