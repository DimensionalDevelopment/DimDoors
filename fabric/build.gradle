plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

def includeCompile(entry) {
    project.dependencies {
        modImplementation(entry)
        include(entry)
    }
}

dependencies {
    def loaderExclude = { exclude group: "net.fabricmc", module: "fabric-loader" }

    minecraft libs.minecraft
    mappings loom.layered {
        officialMojangMappings()
        parchment(variantOf(libs.parchment) { artifactType("zip") })
    }
    modImplementation libs.fabric.api
    modImplementation libs.fabric.loader

    modLocalRuntime(libs.sable.fabric, loaderExclude)

    includeCompile libs.apfloat
    includeCompile libs.jheaps
    includeCompile libs.jgrapht
    includeCompile libs.poly2tri
    includeCompile libs.fabric.asm

    modLocalRuntime libs.wthit.fabric
    modLocalRuntime(libs.cloth.config.fabric, loaderExclude)

    modLocalRuntime libs.worldedit

    // Moonlight: only the datagen LanguageProvider compiles against it.
    modCompileOnly libs.moonlight
    modLocalRuntime libs.moonlight
    modCompileOnly libs.modmenu
    modLocalRuntime libs.modmenu
    modCompileOnly(libs.sodium.fabric, loaderExclude)

    modCompileOnly libs.iris.fabric

    modCompileOnly libs.rei.api.fabric

    modCompileOnly libs.jei.api.fabric

    switch (recipe_viewer) {
        case "rei" -> {

            modLocalRuntime(libs.rei.fabric) {
                exclude group: "net.fabricmc", module: "fabric-loader"
                exclude group: "net.fabricmc.fabric-api"
                exclude group: "me.shedaniel.cloth"
            }
        }
        case "jei" -> {
            modLocalRuntime libs.jei.fabric
        }
    }

    modLocalRuntime(libs.imguimc.fabric) {
        exclude group: "net.fabricmc", module: "fabric-loader"
        exclude group: "net.fabricmc.fabric-api"
    }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
        useLegacyMixinAp = true
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        data {
            inherit client
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${project(":common").file("src/main/generated")}"
            vmArg "-Dfabric-api.datagen.modid=dimdoors"

            runDir "build/datagen"
        }

    }

    sourceSets {
        main {
            java {
                srcDir "src/main/datagen"
            }
            resources {
                srcDirs += [
                        project(":common").file("src/main/generated")
                ]
            }
        }
    }
}

tasks.register("traceFabricLoader") {
    doLast {
        def runtime = configurations.runtimeClasspath

        println "runtimeClasspath hierarchy:"
        runtime.hierarchy.each { configuration ->
            println "\n${project.path}:${configuration.name}"

            configuration.dependencies
                    .findAll {
                        it.group == "net.fabricmc" &&
                                it.name == "fabric-loader"
                    }
                    .each {
                        println "  DIRECT: ${it.group}:${it.name}:${it.version}"
                    }

            configuration.dependencyConstraints
                    .findAll {
                        it.group == "net.fabricmc" &&
                                it.name == "fabric-loader"
                    }
                    .each {
                        println "  CONSTRAINT: ${it.group}:${it.name}:${it.version}"
                    }
        }
    }
}

tasks.register("traceFabricLoaderOrigins") {
    doLast {
        configurations.findAll { configuration ->
            configuration.canBeResolved &&
                    (configuration.name.toLowerCase().contains("mod") ||
                            configuration.name.toLowerCase().contains("runtime"))
        }.each { configuration ->
            try {
                def root = configuration.incoming.resolutionResult.rootComponent.get()
                def paths = []

                def visit
                visit = { component, path, seen ->
                    component.dependencies.each { dependency ->
                        if (!(dependency instanceof org.gradle.api.artifacts.result.ResolvedDependencyResult)) {
                            return
                        }

                        def selected = dependency.selected
                        def module = selected.moduleVersion
                        def edge = "${dependency.requested.displayName} -> ${selected.id.displayName}"
                        def nextPath = path + edge

                        if (module?.group == "net.fabricmc" &&
                                module.name == "fabric-loader") {
                            paths << nextPath
                            return
                        }

                        def nextSeen = new LinkedHashSet(seen)
                        if (nextSeen.add(selected.id)) {
                            visit(selected, nextPath, nextSeen)
                        }
                    }
                }

                visit(root, [], [root.id] as Set)

                if (!paths.empty) {
                    println "\n=== ${configuration.name} ==="

                    paths.each { path ->
                        println path.collect { "  ${it}" }.join("\n")
                        println()
                    }
                }
            } catch (Exception ignored) {
                // Some Loom configurations cannot be resolved independently.
            }
        }
    }
}
