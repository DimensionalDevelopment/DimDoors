plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

def includeMod(entry) {
    project.dependencies {
        modCompileOnly(entry)
        modLocalRuntime(entry)
        include(entry)
    }
}


dependencies {
    minecraft libs.minecraft
    mappings loom.layered {
        officialMojangMappings()
        parchment(variantOf(libs.parchment) { artifactType("zip") })
    }
    modImplementation libs.fabric.api
    modImplementation libs.fabric.loader
    modImplementation libs.fabric.language.kotlin
    include modApi('teamreborn:energy:4.1.0')
    includeMod libs.fabric.asm


    modCompileOnly(libs.sodium.fabric) { exclude group: "net.fabricmc", module: "fabric-loader" }
    modCompileOnly libs.iris.fabric
}

loom {
    def aw = file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
        useLegacyMixinAp = true
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
