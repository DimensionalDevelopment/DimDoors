plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }

    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        url = "https://maven.neoforged.net/releases"
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    // Remove the next line if you don't want to depend on the API
    modApi "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle(project(path: ":common", configuration: "transformProductionNeoForge"))

    include "org.jgrapht:jgrapht-core:1.1.0"
    include "com.github.DimensionalDevelopment:poly2tri.java:0.1.1"

    modCompileOnly "mcp.mobius.waila:wthit-api:neo-${wthitVersion}"
    modCompileOnly "mcp.mobius.waila:wthit:neo-${wthitVersion}"
//    modApi "lol.bai:badpackets:forge-0.4.2"
//    modApi "com.sk89q.worldedit:worldedit-forge-mc${rootProject.world_edit_minecraft_version}:${rootProject.worldedit}"
    modCompileOnly("curse.maven:worldedit-${project.properties["worldedit_CF"]}:${project.properties["worldedit_CF_version"]}")
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-api-neoforge:${project.properties["rei"]}")
    modCompileOnlyApi("mezz.jei:jei-${project.properties["minecraft_version"]}-neoforge-api:${project.properties["jei"]}")

    switch (project.findProperty('recipe_viewer')?.toString()) {
        case 'rei':
            modCompileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-neoforge:${project.findProperty('rei')}"
            break
        case 'jei':
            modRuntimeOnly "mezz.jei:jei-${project.findProperty('minecraft_version')}-neoforge:${project.findProperty('jei')}"
            break
    }
}

processResources {
    def props = [
            "version": mod_version,
            "minecraft_version": minecraft_version,
            "architectury_version": architectury_version
    ]

    // Inject trace logging for all matched files
    eachFile { details ->
        if (details.path == "META-INF/neoforge.mods.toml") {
            logger.lifecycle("Matched: ${details.path} — expanding")
        }
    }

    filesMatching("META-INF/neoforge.mods.toml") {
        expand props
    }

    from("src/main/resources") {
        include("**/**")
        duplicatesStrategy = DuplicatesStrategy.WARN
    }

    from(project(":common").file("src/main/resources")) {
        include("**/**")
        duplicatesStrategy = DuplicatesStrategy.WARN
    }
}
shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"
    exclude("dimdoors-common-refmap.json")
    exclude("dimdoors.accesswidener")

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    archiveClassifier = "${project.properties["minecraft_version"]}-neoforge"
}

jar.archiveClassifier = "dev"

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

sourceSets {
    main {
        resources {
            srcDirs += [
                    project(":common").file("src/main/generated")
            ]
        }
    }
}
