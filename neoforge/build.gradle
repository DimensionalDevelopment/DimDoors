plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

// Bundled (jar-in-jar) libraries: compile against, run with, ship inside the jar,
// but never publish — consumers get them from the nested jars, not the POM.
def includeCompile(entry) {
    project.dependencies {
        compileOnly(entry)
        localRuntime(entry)
        jarJar(entry)
    }
    neoForge.runs.configureEach {
        project.dependencies.add(additionalRuntimeClasspathConfiguration.name, entry)
    }
}

configurations {
    localRuntime {
        canBeResolved = false
        canBeConsumed = false
    }
    runtimeClasspath.extendsFrom(localRuntime)
}

dependencies {

    localRuntime(libs.sable.neoforge) {
        exclude group: "foundry.veil"
    }

    includeCompile libs.apfloat
    includeCompile libs.jheaps
    includeCompile libs.jgrapht
    includeCompile libs.poly2tri

    compileOnly libs.wthit.api.neoforge
    compileOnly libs.wthit.neoforge
    compileOnly libs.worldedit
    compileOnly libs.rei.api.neoforge
    compileOnly libs.jei.api.neoforge

    localRuntime libs.cloth.config.neoforge

    compileOnly libs.sodium.neoforge
    compileOnly libs.iris.neoforge

    switch (recipe_viewer?.toString()) {
        case "rei" -> {
//            compileOnly libs.rei.default.plugin.neoforge
            localRuntime libs.rei.neoforge
        }
        case "jei" -> {
            localRuntime libs.jei.neoforge
        }
    }

    localRuntime libs.imguimc.neoforge
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    def interfaces = project(':common').file('src/main/resources/interfaces.json')
    if (interfaces.exists()) {
        interfaceInjectionData.from(interfaces.absolutePath)
    }

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
            logLevel = org.slf4j.event.Level.INFO
        }
        client {
            client()
        }
        data {
            data()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir project(':common').file('src/main/generated')
}
